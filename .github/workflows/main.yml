package com.sentinel4ia.app

import android.Manifest
import android.content.Intent
import android.content.pm.PackageManager
import android.net.Uri
import android.os.Build
import android.os.Bundle
import android.provider.Settings
import android.widget.Toast
import androidx.activity.result.contract.ActivityResultContracts
import androidx.appcompat.app.AppCompatActivity
import androidx.core.content.ContextCompat
import com.sentinel4ia.app.databinding.ActivityMainBinding

class MainActivity : AppCompatActivity() {

    private lateinit var binding: ActivityMainBinding
    private lateinit var apiClient: ApiClient

    private val overlayPermissionLauncher = registerForActivityResult(
        ActivityResultContracts.StartActivityForResult()
    ) {
        atualizarEstadoPermissao()
        if (Settings.canDrawOverlays(this)) {
            iniciarPainelFlutuante()
        } else {
            Toast.makeText(
                this,
                "Permissão de sobreposição necessária para exibir o painel flutuante.",
                Toast.LENGTH_LONG
            ).show()
        }
    }

    private val notificationPermissionLauncher = registerForActivityResult(
        ActivityResultContracts.RequestPermission()
    ) {
        verificarPermissaoOverlayEIniciar()
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        binding = ActivityMainBinding.inflate(layoutInflater)
        setContentView(binding.root)

        apiClient = ApiClient(this)
        binding.inputServerUrl.setText(apiClient.baseUrl)

        binding.btnAbrirPainel.setOnClickListener {
            salvarUrlServidor()
            solicitarPermissoesEIniciar()
        }

        binding.btnPararServico.setOnClickListener {
            stopService(Intent(this, FloatingWindowService::class.java))
            Toast.makeText(this, "Painel flutuante encerrado.", Toast.LENGTH_SHORT).show()
        }

        atualizarEstadoPermissao()
    }

    override fun onResume
