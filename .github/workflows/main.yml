EXCHANGE_ID = os.getenv("EXCHANGE_ID", "binance")
API_KEY = os.getenv("EXCHANGE_API_KEY", "SUA_API_KEY_AQUI")
SECRET_KEY = os.getenv("EXCHANGE_SECRET_KEY", "SUA_SECRET_KEY_AQUI")
USE_SANDBOX = os.getenv("EXCHANGE_SANDBOX", "true").lower() == "true"
MOEDA_ALVO = os.getenv("MOEDA_ALVO", "BTC/USDT")
INTERVALO_CICLO_SEGUNDOS = int(os.getenv("INTERVALO_CICLO_SEGUNDOS", "5"))


class Sistema4IAsUnanime:
    def __init__(self, banca_total=1000.0, percentual_risco=10):
        self.banca_inicial = banca_total
        self.banca_atual = banca_total
        self.percentual = max(0.01, min(0.20, percentual_risco / 100.0))
        self.moeda_alvo = MOEDA_ALVO
        self.em_operacao = False
        self.preco_compra = 0.0
        self.ativo = False
        self.status_atual = "Aguardando comando..."
        self.ultimas_decisoes = ["ESPERAR", "ESPERAR", "ESPERAR", "ESPERAR"]
        self.ultimo_preco = 0.0
        self.ultimo_rsi = 50.0
        self.em_cooldown_reset = False
        self._lock = threading.Lock()

    def atualizar_config(self, percentual: int, ativo: bool):
        with self._lock:
            self.percentual = max(0.01, min(0.20, percentual / 100.0))
            self.ativo = ativo
            if not ativo:
                self.status_atual = "Sistema Pausado"
            elif self.status_atual in ("Aguardando comando...", "Sistema Pausado"):
                self.status_atual = "4 IAs Analisando"

    def ia_1_fundo_preco(self, preco_atual, suporte):
        """IA 1: Analisa fundo de preço (compra na baixa, vende na alta)."""
        if not self.em_operacao and preco_atual <= suporte * 1.002:
            return "COMPRAR"
        elif self.em_operacao and preco_atual >= self.preco_compra * 1.015:
            return "VENDER"
        return "ESPERAR"

    def ia_2_indicador_exaustao(self, rsi):
        """IA 2: Analisa exaustão de mercado via RSI (<25 baixa extrema, >70 alta extrema)."""
        if not self.em_operacao and rsi < 25:
            return "COMPRAR"
        elif self.em_operacao and rsi > 70:
            return "VENDER"
        return "ESPERAR"

    def ia_3_fluxo_volume(self, volume_comprador, volume_vendedor):
        """IA 3: Analisa força real de volume financeiro entrando."""
        if not self.em_operacao and volume_comprador > volume_vendedor * 1.5:
            return "COMPRAR"
        elif self.em_operacao and volume_vendedor > volume_comprador * 1.3:
            return "VENDER"
        return "ESPERAR"

    def ia_4_auditora_risco(self, volatilidade, preco_atual):
        """IA 4: Auditora de segurança. Bloqueia instabilidade e aplica trava de 1% de erro."""
        if volatilidade > 0.05:
            return "BLOQUEAR"
        if self.em_operacao:
            if preco_atual <= self.preco_compra * 0.99:
                return "ERRO_STOP"
            return "VENDER" if preco_atual > self.preco_compra else "ESPERAR"
        return "COMPRAR"

    def avaliar_oportunidade(self, dados: Dict[str, Any], conector: Optional["ConectorCCXT"] = None):
        with self._lock:
            if not self.ativo or self.em_cooldown_reset:
                return

            self.ultimo_preco = dados["preco"]
            self.ultimo_rsi = dados["rsi"]

            d1 = self.ia_1_fundo_preco(dados["preco"], dados["suporte"])
            d2 = self.ia_2_indicador_exaustao(dados["rsi"])
            d3 = self.ia_3_fluxo_volume(dados["vol_compra"], dados["vol_venda"])
            d4 = self.ia_4_auditora_risco(dados["volatilidade"], dados["preco"])

            self.ultimas_decisoes = [d1, d2, d3, d4]

            if d4 == "ERRO_STOP":
                self._executar_reset_locked(dados["preco"], conector)
                return

            decisoes = [d1, d2, d3, d4]
            # REGRA DE UNANIMIDADE: Se UMA única IA discordar, todas pulam imediatamente
            if len(set(decisoes)) != 1 or decisoes[0] in ["ESPERAR", "BLOQUEAR"]:
                self.status_atual = f"Pulando - Sem Consenso ({decisoes})"
                return

            acao = decisoes[0]
            if acao == "COMPRAR" and not self.em_operacao:
                valor_aposta = self.banca_atual * self.percentual
                if conector is not None:
                    conector.executar_ordem_mercado("buy", self.moeda_alvo, valor_aposta, dados["preco"])
                self.preco_compra = dados["preco"]
                self.em_operacao = True
                self.status_atual = f"Comprado na Baixa a {self.preco_compra:.2f} (R$ {valor_aposta:.2f})"
                logger.info(self.status_atual)

            elif acao == "VENDER" and self.em_operacao:
                lucro = (dados["preco"] - self.preco_compra) / self.preco_compra
                valor_operado = self.banca_atual * self.percentual
                ganho_reais = valor_operado * lucro
                if conector is not None:
                    conector.executar_ordem_mercado("sell", self.moeda_alvo, valor_operado, dados["preco"])
                self.banca_atual += ganho_reais
                self.em_operacao = False
                self.preco_compra = 0.0
                self.status_atual = f"Vendido na Alta! Lucro: +R$ {ganho_reais:.2f}"
                logger.info(self.status_atual)

    def _executar_reset_locked(self, preco_saida: float, conector: Optional["ConectorCCXT"] = None):
        """Ao atingir 1% de erro, encerra, reseta o ciclo e recomeça do zero."""
        valor_operado = self.banca_atual * self.percentual
        if conector is not None and self.em_operacao:
            conector.executar_ordem_mercado("sell", self.moeda_alvo, valor_operado, preco_saida)
        prejuizo = valor_operado * 0.01
        self.banca_atual -= prejuizo
        self.em_operacao = False
        self.preco_compra = 0.0
        self.em_cooldown_reset = True
        self.status_atual = f"Reset por Erro 1% (-R$ {prejuizo:.2f}). Reiniciando ciclo..."
        logger.warning(self.status_atual)

        def finalizar_cooldown():
            time.sleep(10)
            with self._lock:
                self.em_cooldown_reset = False
                if self.ativo:
                    self.status_atual = "4 IAs Analisando"
                else:
                    self.status_atual = "Sistema Pausado"

        threading.Thread(target=finalizar_cooldown, daemon=True).start()

    def protocolo_reinicio(self, preco_saida):
        """Interface síncrona compatível com chamadas diretas."""
        prejuizo = (self.banca_atual * self.percentual) * 0.01
        self.banca_atual -= prejuizo
        self.em_operacao = False
        self.preco_compra = 0.0
        self.status_atual = f"Reset por Erro 1% (-R$ {prejuizo:.2f}). Reiniciando ciclo..."
        time.sleep(10)

    def obter_estado(self) -> Dict[str, Any]:
        with self._lock:
            return {
                "ativo": self.ativo,
                "percentual_risco": round(self.percentual * 100),
                "banca_inicial": round(self.banca_inicial, 2),
                "banca_atual": round(self.banca_atual, 2),
                "moeda_alvo": self.moeda_alvo,
                "em_operacao": self.em_operacao,
                "preco_compra": round(self.preco_compra, 2),
                "ultimo_preco": round(self.ultimo_preco, 2),
                "ultimo_rsi": round(self.ultimo_rsi, 2),
                "decisoes_ias": self.ultimas_decisoes,
                "status_atual": self.status_atual,
            }


class ConectorCCXT:
    """
    Camada pronta para operar na corretora real via CCXT.
    Basta preencher API_KEY e SECRET_KEY para habilitar ordens reais.
    """

    def __init__(self, exchange_id: str, api_key: str, secret_key: str, sandbox: bool = True):
        self.exchange_id = exchange_id
        self.credenciais_configuradas = (
            api_key != "SUA_API_KEY_AQUI"
            and secret_key != "SUA_SECRET_KEY_AQUI"
            and bool(api_key.strip())
            and bool(secret_key.strip())
        )

        exchange_class = getattr(ccxt, exchange_id)
        config = {
            "apiKey": api_key if self.credenciais_configuradas else "",
            "secret": secret_key if self.credenciais_configuradas else "",
            "enableRateLimit": True,
            "options": {"defaultType": "spot"},
        }
        self.exchange = exchange_class(config)
        if sandbox and hasattr(self.exchange, "set_sandbox_mode"):
            try:
                self.exchange.set_sandbox_mode(True)
            except Exception as exc:
                logger.warning(f"Sandbox não suportado em {exchange_id}: {exc}")

    @staticmethod
    def _calcular_rsi(closes: np.ndarray, period: int = 14) -> float:
        if len(closes) < period + 1:
            return 50.0
        deltas = np.diff(closes)
        gains = np.where(deltas > 0, deltas, 0.0)
        losses = np.where(deltas < 0, -deltas, 0.0)
        avg_gain = np.mean(gains[-period:])
        avg_loss = np.mean(losses[-period:])
        if avg_loss == 0:
            return 100.0
        rs = avg_gain / avg_loss
        return float(100.0 - (100.0 / (1.0 + rs)))

    def coletar_dados_mercado(self, symbol: str) -> Dict[str, Any]:
        """Coleta candles OHLCV reais via CCXT e calcula suporte, RSI, volume e volatilidade."""
        candles = self.exchange.fetch_ohlcv(symbol, timeframe="1m", limit=30)
        closes = np.array([c[4] for c in candles], dtype=float)
        lows = np.array([c[3] for c in candles], dtype=float)
        highs = np.array([c[2] for c in candles], dtype=float)
        opens = np.array([c[1] for c in candles], dtype=float)
        volumes = np.array([c[5] for c in candles], dtype=float)

        preco_atual = float(closes[-1])
        suporte = float(np.min(lows[:-1])) if len(lows) > 1 else preco_atual
        rsi = self._calcular_rsi(closes, period=14)

        # Estima pressão compradora vs vendedora nos últimos 5 candles
        ult_opens = opens[-5:]
        ult_closes = closes[-5:]
        ult_vols = volumes[-5:]
        vol_compra = float(np.sum(ult_vols[ult_closes >= ult_opens]))
        vol_venda = float(np.sum(ult_vols[ult_closes < ult_opens]))
        vol_compra = max(vol_compra, 1e-6)
        vol_venda = max(vol_venda, 1e-6)

        # Volatilidade relativa no candle atual
        volatilidade = float((highs[-1] - lows[-1]) / preco_atual) if preco_atual > 0 else 0.0

        return {
            "preco": preco_atual,
            "suporte": suporte,
            "rsi": rsi,
            "vol_compra": vol_compra,
            "vol_venda": vol_venda,
            "volatilidade": volatilidade,
        }

    def executar_ordem_mercado(self, lado: str, symbol: str, valor_usdt: float, preco_ref: float):
        """Executa ordem real na corretora quando API_KEY e SECRET_KEY estiverem preenchidas."""
        quantidade = round(valor_usdt / max(preco_ref, 1e-8), 6)
        if not self.credenciais_configuradas:
            logger.info(
                f"[MODO SIMULAÇÃO CCXT] Ordem {lado.upper()} {quantidade} {symbol} (~$ {valor_usdt:.2f}). "
                "Configure API_KEY e SECRET_KEY para envio real."
            )
            return None

        try:
            if lado == "buy":
                ordem = self.exchange.create_market_buy_order(symbol, quantidade)
            else:
                ordem = self.exchange.create_market_sell_order(symbol, quantidade)
            logger.info(f"[CCXT ORDEM EXECUTADA] {lado.upper()} {symbol}: {ordem.get('id')}")
            return ordem
        except Exception as exc:
            logger.error(f"Erro ao executar ordem CCXT ({lado} {symbol}): {exc}")
            return None


# ==============================================================================
# INICIALIZAÇÃO DO SERVIDOR FASTAPI E LOOP 24H EM SEGUNDO PLANO
# ==============================================================================
app = FastAPI(title="Sentinel 4-IA API", version="1.0.0")

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

sistema = Sistema4IAsUnanime(banca_total=1000.0, percentual_risco=10)
conector = ConectorCCXT(
    exchange_id=EXCHANGE_ID,
    api_key=API_KEY,
    secret_key=SECRET_KEY,
    sandbox=USE_SANDBOX,
)


class ConfigPayload(BaseModel):
    percentual: int = Field(..., ge=1, le=20, description="Percentual da banca entre 1% e 20%")
    ativo: bool = Field(..., description="True para iniciar modo automático, False para parar")


class DadosMercadoPayload(BaseModel):
    preco: float
    suporte: float
    rsi: float
    vol_compra: float
    vol_venda: float
    volatilidade: float


def loop_monitoramento_24h():
    """Thread contínua que coleta dados da corretora via CCXT e alimenta as 4 IAs."""
    logger.info("Loop 24h Sentinel 4-IA iniciado.")
    while True:
        try:
            if sistema.ativo and not sistema.em_cooldown_reset:
                dados = conector.coletar_dados_mercado(sistema.moeda_alvo)
                sistema.avaliar_oportunidade(dados, conector=conector)
        except Exception as exc:
            logger.error(f"Falha no ciclo de coleta/avaliação CCXT: {exc}")
        time.sleep(INTERVALO_CICLO_SEGUNDOS)


@app.on_event("startup")
def iniciar_background_worker():
    worker = threading.Thread(target=loop_monitoramento_24h, daemon=True)
    worker.start()


@app.get("/health")
def health_check():
    return {
        "ok": True,
        "exchange": EXCHANGE_ID,
        "ccxt_autenticado": conector.credenciais_configuradas,
    }


@app.get("/status")
def obter_status():
    return sistema.obter_estado()


@app.post("/config")
def atualizar_configuracao(payload: ConfigPayload):
    sistema.atualizar_config(payload.percentual, payload.ativo)
    return sistema.obter_estado()


@app.post("/avaliar")
def avaliar_manual(dados: DadosMercadoPayload):
    """Endpoint opcional para testes ou webhooks externos enviando ticks de mercado."""
    sistema.avaliar_oportunidade(dados.model_dump(), conector=conector)
    return sistema.obter_estado()


if __name__ == "__main__":
    import uvicorn

    uvicorn.run("server:app", host="0.0.0.0", port=int(os.getenv("PORT", "8000")), reload=False)


